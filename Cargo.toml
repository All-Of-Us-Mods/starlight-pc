[package]
name = "Starlight"
version = "2.0.1"
description = "Among Us mod manager"
authors = ["yanpla"]
license = "GPL-3.0-only"
repository = ""
edition = "2024"
rust-version = "1.92.0"

[dependencies]
# Tracks Zed's main branch; the exact commit lives in Cargo.lock. gpui-component
# below must resolve to the same gpui, so update the two together
# (`cargo update`) rather than one at a time.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
  "font-kit",
  "runtime_shaders",
  "x11",
  "wayland",
] }
reqwest_client = { git = "https://github.com/zed-industries/zed" }
# Tracks gpui-component's main branch, again pinned by Cargo.lock. It must
# agree with the gpui above on a single gpui version.
gpui-component = { git = "https://github.com/longbridge/gpui-component", features = [
  "tree-sitter-markdown",
] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
tree-sitter = "0.26"
tree-sitter-md = "0.5"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "json",
  "rustls",
] }
async-broadcast = "0.7"
urlencoding = "2.1.3"
zip = { version = "8", default-features = false, features = ["deflate"] }
sha2 = "0.11"
uuid = { version = "1.22.0", default-features = false, features = ["v4"] }
semver = { version = "1.0", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6.0"
flate2 = "1.1.9"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = ["Win32_System_LibraryLoader"] }
# Renders profile icons (png/jpg/…) into the .ico used by desktop shortcuts.
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "bmp",
  "webp",
  "ico",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
